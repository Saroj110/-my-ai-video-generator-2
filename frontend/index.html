<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Video Studio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111318;
      color: #fff;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 { margin-bottom: 8px; }
    p { color: #aaa; }

    .card {
      background: #1a1d24;
      border: 1px solid #2b303a;
      border-radius: 16px;
      padding: 24px;
      margin-top: 24px;
    }

    textarea, input, select {
      width: 100%;
      box-sizing: border-box;
      background: #101217;
      color: #fff;
      border: 1px solid #343a46;
      border-radius: 10px;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 16px;
    }

    textarea { min-height: 140px; resize: vertical; }

    button {
      background: #ff6b35;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 12px 20px;
      cursor: pointer;
      font-weight: 700;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 16px;
      color: #8fd3ff;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 12px;
      background: #000;
    }

    .download {
      display: inline-block;
      margin-top: 12px;
      background: #2a2f3a;
      color: #fff;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Video Studio</h1>
    <p>Text-to-Video powered by Wan 2.1</p>

    <div class="card">
      <label>What do you want to create?</label>
      <textarea id="prompt" placeholder="A cute 3D cartoon boy walking through a colorful park..."></textarea>

      <label>Style</label>
      <select id="style">
        <option>3D</option>
        <option>Cartoon</option>
        <option>Cinematic</option>
        <option>Realistic</option>
        <option>Anime</option>
      </select>

      <label>Aspect Ratio</label>
      <select id="ratio">
        <option value="16:9">16:9</option>
        <option value="9:16">9:16</option>
        <option value="1:1">1:1</option>
        <option value="4:5">4:5</option>
      </select>

      <label>Duration</label>
      <select id="duration">
        <option value="0.5">0.5 seconds</option>
        <option value="1" selected>1 second</option>
        <option value="2">2 seconds</option>
        <option value="3">3 seconds</option>
        <option value="4">4 seconds</option>
        <option value="5">5 seconds</option>
      </select>

      <button id="generateBtn">Generate Video</button>

      <div id="status" class="status"></div>

      <div id="result" style="display:none;">
        <video id="video" controls></video>
        <a id="download" class="download" download>Download Video</a>
      </div>
    </div>
  </div>

  <script>
    const generateBtn = document.getElementById("generateBtn");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const video = document.getElementById("video");
    const download = document.getElementById("download");

    generateBtn.addEventListener("click", async () => {
      const prompt = document.getElementById("prompt").value.trim();
      const style = document.getElementById("style").value;
      const ratio = document.getElementById("ratio").value;
      const duration = Number(document.getElementById("duration").value);

      if (!prompt) {
        status.textContent = "Please enter a prompt.";
        return;
      }

      generateBtn.disabled = true;
      result.style.display = "none";
      status.textContent = "Sending request to Wan video service...";

      try {
        const response = await fetch("/api/generate-video", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            prompt: `${style} style, ${prompt}`,
            duration_seconds: duration,
            aspect_ratio: ratio
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "Video generation failed.");
        }

        const videoUrl = data.video_url;

        video.src = videoUrl;
        download.href = videoUrl;

        result.style.display = "block";
        status.textContent = "Video generated successfully.";
      } catch (error) {
        status.textContent = error.message;
      } finally {
        generateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
