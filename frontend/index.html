<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Video Studio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111318;
      color: #fff;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 { margin-bottom: 8px; }
    p { color: #aaa; }

    .card {
      background: #1a1d24;
      border: 1px solid #2b303a;
      border-radius: 16px;
      padding: 24px;
      margin-top: 24px;
    }

    textarea, input, select {
      width: 100%;
      box-sizing: border-box;
      background: #101217;
      color: #fff;
      border: 1px solid #343a46;
      border-radius: 10px;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 16px;
    }

    textarea { min-height: 140px; resize: vertical; }

    button {
      background: #ff6b35;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 12px 20px;
      cursor: pointer;
      font-weight: 700;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 16px;
      color: #8fd3ff;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 12px;
      background: #000;
    }

    .download {
      display: inline-block;
      margin-top: 12px;
      background: #2a2f3a;
      color: #fff;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Video Studio</h1>
    <p>Text-to-Video powered by Wan 2.1</p>

    <div class="card">
      <label>What do you want to create?</label>
      <textarea id="prompt" placeholder="A cute 3D cartoon boy walking through a colorful park..."></textarea>

      <label>Language</label>
      <select id="language">
        <option value="Hindi">Hindi</option>
        <option value="English">English</option>
      </select>

      <label>Voice</label>
      <select id="voice">
        <option value="Hindi Female">Female</option>
        <option value="Hindi Male">Male</option>
      </select>

      <label>Voice-over Text</label>
      <textarea id="voiceText" placeholder="Write the narration you want to hear in the video..."></textarea>

      <label>Style</label>
      <select id="style">
        <option>3D</option>
        <option>Cartoon</option>
        <option>Cinematic</option>
        <option>Realistic</option>
        <option>Anime</option>
      </select>

      <label>Aspect Ratio</label>
      <select id="ratio">
        <option value="16:9">16:9</option>
        <option value="9:16">9:16</option>
        <option value="1:1">1:1</option>
        <option value="4:5">4:5</option>
      </select>

      <label>Duration</label>
      <select id="duration">
        <option value="0.5">0.5 seconds</option>
        <option value="1" selected>1 second</option>
        <option value="2">2 seconds</option>
        <option value="3">3 seconds</option>
        <option value="4">4 seconds</option>
        <option value="5">5 seconds</option>
      </select>

      <button id="generateBtn">Generate Video</button>
      <button id="storyboardBtn" type="button">Open Twinkle Storyboard</button>
      <div id="storyboard" style="display:none; margin-top:20px;"></div>
    

      <div id="status" class="status"></div>

      <div id="result" style="display:none;">
        <video id="video" controls></video>
        <a id="download" class="download" download>Download Video</a>
      </div>
    </div>
  </div>

  <script>
    
    const storyboardBtn = document.getElementById("storyboardBtn");
    const storyboardBox = document.getElementById("storyboard");

    storyboardBtn.addEventListener("click", async () => {
      storyboardBox.style.display = "block";
      storyboardBox.textContent = "Loading storyboard...";

      try {
        const response = await fetch("/api/storyboard/twinkle_60s");
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "Could not load storyboard.");
        }

        storyboardBox.innerHTML = `
          <h2>${data.title}</h2>
          <p>Total duration: ${data.duration_seconds} seconds</p>
          ${data.scenes.map(scene => `
            <div style="
              border:1px solid #343a46;
              border-radius:10px;
              padding:14px;
              margin-top:10px;
            ">
              <strong>Scene ${scene.id}: ${scene.title}</strong>
              <div style="color:#aaa; margin-top:6px;">
                ${scene.start}s – ${scene.end}s
              </div>
              <div style="margin-top:8px;">
                ${scene.visual}
              </div>
              <div style="color:#8fd3ff; margin-top:8px;">
                Audio: ${scene.audio}
              </div>
            </div>
          `).join("")}
        `;
      } catch (error) {
        storyboardBox.textContent = error.message;
      }
    });

    const generateBtn = document.getElementById("generateBtn");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const video = document.getElementById("video");
    const download = document.getElementById("download");

    const languageSelect = document.getElementById("language");
    const voiceSelect = document.getElementById("voice");

    languageSelect.addEventListener("change", () => {
      if (languageSelect.value === "Hindi") {
        voiceSelect.innerHTML = `
          <option value="Hindi Female">Female</option>
          <option value="Hindi Male">Male</option>
        `;
      } else {
        voiceSelect.innerHTML = `
          <option value="English Female">Female</option>
          <option value="English Male">Male</option>
        `;
      }
    });

    generateBtn.addEventListener("click", async () => {
      const prompt = document.getElementById("prompt").value.trim();
      const style = document.getElementById("style").value;
      const ratio = document.getElementById("ratio").value;
      const duration = Number(document.getElementById("duration").value);
      const language = document.getElementById("language").value;
      const voice = document.getElementById("voice").value;
      const voiceText = document.getElementById("voiceText").value.trim();

      if (!prompt) {
        status.textContent = "Please enter a prompt.";
        return;
      }

      generateBtn.disabled = true;
      result.style.display = "none";
      status.textContent = "Sending request to Wan video service...";

      try {
        const response = await fetch("/api/create-video", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            prompt: `${style} style, ${prompt}`,
            voice_over_text: voiceText,
            voice: voice,
            duration_seconds: duration,
            aspect_ratio: ratio
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "Video generation failed.");
        }

        const videoUrl = data.video_url;

        video.src = videoUrl;
        download.href = videoUrl;

        result.style.display = "block";
        status.textContent = "Video generated successfully.";
      } catch (error) {
        status.textContent = error.message;
      } finally {
        generateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
